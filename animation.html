<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes example {
            0% {background-color: beige;}
            28% {background-color: aquamarine;} 
            60% {background-color: aqua;} 
            100% {background-color: bisque;}
     }
     div {
        width: 100px;
        height: 100px;
        background-color: beige;
        animation-name: example;
        animation-duration:4s;
  }
    </style>
 </head>
<body>
    <div>
        Hello!
     </div>
    </body>
</html>

<!DOCTYPE html>
<html>

<body>

    <p id="demo">Click the button</p>
    <button onclick="loadData()">Click Me</button>

    <script>
        // async function
        async function loadData() {
            let result = await new Promise(resolve =>
                setTimeout(() => resolve("Hello from async!"), 1000)
            );

            document.getElementById("demo").innerText = result;
        }
    </script>

</body>

</html>

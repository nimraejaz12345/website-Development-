<!DOCTYPE html>
<html>

<head>
    <title>Car Class Example</title>
</head>

<body>

    <h2>Car Information:</h2>
    <div id="output"></div>

    <script>
        // Parent class
        class Vehicle {
            constructor(brand, color) {
                this.brand = brand;
                this.color = color;
            }

            displayInfo() {
                return "Brand: " + this.brand + ", Color: " + this.color;
            }

            static vehicleType() {
                return "This is a vehicle.";
            }
        }

        // Child class inheriting Vehicle
        class Car extends Vehicle {
            constructor(brand, color, model, price) {
                super(brand, color);
                this.model = model;
                this.price = price; // Price in Pakistani Rupees
            }

            displayCarInfo() {
                return (
                    "Brand: " + this.brand +
                    ", Color: " + this.color +
                    ", Model: " + this.model +
                    ", Price: ₨" + this.price.toLocaleString()
                );
            }
        }

        // Using the classes
        let outputDiv = document.getElementById("output");

        outputDiv.innerHTML += Vehicle.vehicleType() + "<br>";

        let myCar = new Car("Toyota", "White", "Corolla", 609000);
        outputDiv.innerHTML += myCar.displayInfo() + "<br>";
        outputDiv.innerHTML += myCar.displayCarInfo() + "<br>";
    </script>

</body>

</html>

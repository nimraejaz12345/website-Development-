<!DOCTYPE html>
<html>

<head>
    <title>CSS Text Styling</title>

    <style>
        h1 {
            color: blue;
            text-align: center;
            text-decoration: underline;
        }

        p {
            color: green;
            font-size: 18px;
            font-family: Arial;
        }

        .highlight {
            color: red;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <h1>CSS Text Styling</h1>

    <p>This is a simple paragraph styled using CSS.</p>

    <p class="highlight">this text is decorated differently</p>

</body>

</html>

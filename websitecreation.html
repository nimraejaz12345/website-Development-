<!DOCTYPE html>
<html>

<head>
    <title>Website with Banner</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        /* Navbar */
        .navbar {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }

        .navbar a {
            color: white;
            margin: 10px;
            text-decoration: none;
            font-size: 18px;
        }

        /* Banner */
        .banner {
            background: url('https://picsum.photos/1200/300') no-repeat center;
            background-size: cover;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 30px;
            font-weight: bold;
        }

        /* Content */
        .content {
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>

    <!-- Banner -->
    <div class="banner">
        My Website Banner
    </div>

    <!-- Content -->
    <div class="content">
        <h2>Welcome to My Website</h2>
        <p>This is a simple layout with navigation bar.</p>
    </div>

</body>

</html>

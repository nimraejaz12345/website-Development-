<!DOCTYPE html>

<head>
     <style>
        body {
            font-family: Arial, sans-serif;
            height: 2000px;
            
        }

        .box {
            width: 150px;
            height: 100px;
            color: white;
            padding: 10px;
            margin: 20px;
        }

        
        .static {
            position: static;
            background-color: gray;
        }

        
        .relative {
            position: relative;
            top: 20px;
            left: 30px;
            background-color: blue;
        }

        
        .container {
            position: relative;
            border: 2px solid black;
            height: 200px;
            margin: 20px;
        }

        .absolute {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: red;
        }

        
        .fixed {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background-color: green;
        }

        
        .sticky {
            position: sticky;
            top: 0;
            background-color: purple;
        }
    </style>
</head>

<body>

    <h2 class="sticky">Sticky Header</h2>

    <div class="box static">
        Static Position
    </div>

    <div class="box relative">
        Relative Position
    </div>

    <div class="container">
        <div class="box absolute">
            Absolute Position
        </div>
    </div>

    <div class="box fixed">
        Fixed Position
    </div>

</body>

</html>

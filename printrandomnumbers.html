<!DOCTYPE html>
<html>

<head>
    <title>Random Numbers</title>
</head>

<body>

    <h2>Random Numbers:</h2>
    <div id="output"></div>

    <script>
        let count = 0;
        let outputDiv = document.getElementById("output");

        while (count < 5) {
            let randomNum = Math.floor(Math.random() * 100) + 1; // Random number between 1 and 100
            outputDiv.innerHTML += randomNum + "<br>";
            count++;
        }
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Restaurant Footer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        /* Social Media Section */
        .social {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .social a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
            font-size: 18px;
        }

        .social a:hover {
            color: orange;
        }

        /* Footer Section */
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <!-- Social Media Section -->
    <div class="social">
        <h2>Follow Us</h2>
        <a href="#">Facebook</a>
        <a href="#">Instagram</a>
        <a href="#">Twitter</a>
    </div>

    <!-- Footer Section -->
    <footer>

        <p>Contact: info@nimrasrestaurant.com</p>
    </footer>

</body>

</html>

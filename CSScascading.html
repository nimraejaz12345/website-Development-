<!DOCTYPE html>
<html>

<head>
    <title>CSS Cascading Example</title>

    <!-- Internal CSS -->
    <style>
        p {
            color: blue;
            font-size: 18px;
        }

        .special {
            color: green;
        }
    </style>
</head>

<body>

    <h2>CSS Cascading Effect</h2>

    <!-- This paragraph uses the p rule -->
    <p>This text is blue because of the p selector.</p>

    <!-- This paragraph uses the class rule -->
    <p class="special">This text is green because class overrides p.</p>

    <!-- Inline CSS overrides everything -->
    <p class="special" style="color: red;">
        This text is red because inline CSS has highest priority.
    </p>

</body>

</html>

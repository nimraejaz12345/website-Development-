<!DOCTYPE html>
<html>

<head>
    <title>Multiply Three Numbers</title>
</head>

<body>

    <h2>Multiplication of Three Numbers</h2>

    <script>
        
        function multiply(x, y, z) {
            return x * y * z;
        }

    
        let x = 2;
        let y = 2;
        let z = 2;

        
        let result = multiply(x, y, z);
        document.write("The multiplication result is: " + result);
    </script>
    </body>
    </html>

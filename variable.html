<!DOCTYPE html>
<html>
    <body>
        <h1>JavaScript Variables</h1>
        <p>Sum of two Numbers</p>
        <p id="result"></p>

            var num1 =200;
            var num2 =650;
            var sum= num1 + num2;
            document.getElementById("result").innerHTML =
            "The total sum is: " + sum;
        </script>
    </body>
</html>

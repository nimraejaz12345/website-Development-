<!DOCTYPE html>
<html>
    <head>
        <style>
            h1 {
                text-decoration: dotted overline;
                text-transform: initial;
            }
            h2 {
                text-decoration: double underline;
                text-transform: lowercase;
            }
            h3 {
                text-decoration: line-through;
                text-transform: none;

            }
            h4 {
                text-decoration: overline;
                text-transform: uppercase;

            }

        
        </style>
    </head>

    <body>
        <h1>codingal</h1>
        <h2>codingal</h2>
        <h3>codingal</h3>
        <h4>codingal</h4>
        
    </body>
</html>

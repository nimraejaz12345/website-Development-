<!DOCTYPE html>
<html>

<head>
    <title>Sum and Trigonometry</title>
</head>

<body>

    <script>


        function sum() {
            let total = 0;
            for (let i = 0; i < arguments.length; i++) {
                total += arguments[i];
            }
            return total;
        }

        document.write("Sum: " + sum(10, 20, 30) + "<br><br>");


        function printTrig(degree) {
            let rad = degree * (Math.PI / 180);

            document.write("Sin: " + Math.sin(rad) + "<br>");
            document.write("Cos: " + Math.cos(rad) + "<br>");
            document.write("Tan: " + Math.tan(rad));
        }

        printTrig(30);

    </script>

</body>

</html>
